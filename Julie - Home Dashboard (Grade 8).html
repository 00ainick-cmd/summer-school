<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading your hub...</title>
<style>
body{background:#f4ece1;color:#2b2230;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
.box{text-align:center;padding:20px;}
.box a{color:#b14a78;}
</style>
</head>
<body>
<div class="box">
  <p>Loading...</p>
  <p><a id="link" href="dashboard.html">Open the dashboard.</a></p>
</div>
<script>
(function(){
  var app={};
  try{app=JSON.parse(localStorage.getItem('edu.app')||'{}');}catch(e){}
  var kids=(app.family&&app.family.kids)||[];
  var target=null;
  if(!app.family || !app.family.setupComplete){
    location.replace('welcome.html'); return;
  }
  for(var i=0;i<kids.length;i++){ if(kids[i].grade===8){ target=kids[i]; break; } }
  if(!target) target=kids[0]||null;
  var href = target ? ('dashboard.html?kid='+encodeURIComponent(target.id)) : 'parent.html';
  document.getElementById('link').href=href;
  location.replace(href);
})();
</script>
</body>
</html>
