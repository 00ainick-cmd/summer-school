<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Summer Learning Studio</title>
<style>
body{background:#f6f3ec;color:#1d1a16;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
.box{text-align:center;padding:20px;}
.box p{color:#4f463c;margin-top:8px;}
.box a{color:#2f5fd0;}
</style>
</head>
<body>
<div class="box">
  <p>Loading your family hub...</p>
  <p><a id="link" href="welcome.html">Click here if not redirected.</a></p>
</div>
<script>
(function(){
  var app={};
  try{app=JSON.parse(localStorage.getItem('edu.app')||'{}');}catch(e){}
  var setup = app && app.family && app.family.setupComplete && (app.family.kids||[]).length>0;
  var dest = setup ? 'parent.html' : 'welcome.html';
  document.getElementById('link').href=dest;
  location.replace(dest);
})();
</script>
</body>
</html>
